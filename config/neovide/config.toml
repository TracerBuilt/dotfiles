frame = "none"
title-hidden = true
neovim-bin = "/home/linuxbrew/.linuxbrew/bin/nvim"

[font]
normal = ["RecMonoLinear Nerd Font"]
size = 11

[font.bold]
family = "RecMonoLinear Nerd Font"
style = "Bold"

[font.italic]
family = "RecMonoCasual Nerd Font"
style = "Italic"

[font.bold_italic]
family = "RecMonoSmCasual Nerd Font"
style = "Bold Italic"
